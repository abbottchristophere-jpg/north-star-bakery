<header>
<img src="media/bakery-logo_c.png" alt="North Star Bakery logo showing a loaf of bread with a wheat stalk inside" width="120" height="120">
<p>North Star Bakery</p>
<nav aria-label="Primary">

</header>

<main id="main-content">

<h1>Contact &amp; Pre-Orders</h1>

<section>
<h2>Visit Us</h2>
<p>123 Main Street, Springfield</p>
<p>Mon-Fri 6am-6pm &middot; Sat 7am-4pm &middot; Sun closed</p>
</section>

<section>
<h2>Inquiry and Pre-Order Request</h2>

<form action="#" method="post" novalidate>

<fieldset>
<legend>Your Information</legend>

<label for="name">Full Name:</label>
<input type="text" id="name" name="name"
minlength="2" maxlength="50" required>
<span id="name-error" class="error-message"></span>

<label for="email">Email Address:</label>
<input type="email" id="email" name="email" required>
<span id="email-error" class="error-message"></span>

</fieldset>

<fieldset>
<legend>Your Request</legend>

<label for="pickup">Preferred Pickup Date:</label>
<input type="date" id="pickup" name="pickup" required>
<span id="pickup-error" class="error-message"></span>

<label for="request-type">Request Type:</label>
<select id="request-type" name="request-type" required>
<option value="">Please choose one</option>
<option value="preorder">Pre-order</option>
<option value="question">General question</option>
</select>

<label for="details">Item Details:</label>
<textarea id="details" name="details"
minlength="10" maxlength="500" required
placeholder="For example: 2 sourdough loaves, 1 dozen croissants, or a 9-inch birthday cake"></textarea>
<span id="details-error" class="error-message"></span>

<label for="allergies">Allergy Notes (optional):</label>
<textarea id="allergies" name="allergies"
maxlength="300"></textarea>

</fieldset>

<button type="submit">Send Request</button>

</form>

</section>

</main>

<footer>
<p>&copy; 2026 North Star Bakery</p>
</footer>

<script src="js/script.js"></script>
</body>
</html>
